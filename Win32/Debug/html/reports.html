<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Trace - Raporlarım</title>
    <style>
        :root {
            --bg:      #202124;
            --bg2:     #292a2d;
            --bg3:     #303134;
            --bg4:     #1a1b1e;
            --border:  #3c4043;
            --text:    #E8EAED;
            --text2:   #9aa0a6;
            --text3:   #5f6368;
            --accent:  #8AB4F8;
            --accent-hover: #aecbfa;
            --danger:  #f28b82;
        }
        body.trace-light {
            --bg:      #F8F9FA;
            --bg2:     #FFFFFF;
            --bg3:     #F1F3F4;
            --bg4:     #F1F3F4;
            --border:  #dadce0;
            --text:    #202124;
            --text2:   #5f6368;
            --text3:   #80868b;
            --accent:  #1a73e8;
            --accent-hover: #5094e8;
            --danger:  #d93025;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 30px 40px; }
        .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
        .header-sub { font-size: 13px; color: var(--text2); margin-left: 32px; }
        .report-list { display: flex; flex-direction: column; gap: 10px; }
        .report-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; transition: border-color 0.15s; animation: fadeIn 0.3s ease; }
        .report-card:hover { border-color: var(--text3); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .report-icon { width: 38px; height: 38px; background: var(--bg3); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .report-body { flex-grow: 1; min-width: 0; }
        .report-title { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .report-meta { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 10px; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge-standart { background: #1a3a5c; color: #8AB4F8; }
        .badge-web { background: #1e3a1e; color: #81c995; }
        body.trace-light .badge-standart { background: #E8F0FE; color: #1a73e8; }
        body.trace-light .badge-web { background: #E6F4EA; color: #1e8e3e; }
        .report-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-view { background: var(--accent); color: var(--bg); border: none; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s; }
        .btn-view:hover { background: var(--accent-hover); }
        body.trace-light .btn-view { color: #FFFFFF; }
        .btn-del { background: transparent; border: 1px solid var(--border); color: var(--text2); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
        .btn-del:hover { border-color: var(--danger); color: var(--danger); }
        .report-id-badge { font-family: 'Consolas', monospace; font-size: 11px; color: var(--text3); background: var(--bg4); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
        .btn-folder { background: transparent; border: 1px solid var(--border); color: var(--text2); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
        .btn-folder:hover { border-color: var(--accent); color: var(--accent); }
        #empty-state { text-align: center; color: var(--text3); padding: 80px 20px; display: none; }
        #empty-state p { font-size: 15px; line-height: 1.7; }
        #empty-state b { color: var(--text2); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="header-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--accent)" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                Raporlarım
            </div>
            <div class="header-sub">Trace AI tarafından oluşturulan tüm raporlar</div>
        </div>
        <button class="btn-folder" onclick="window.location.href='tracecmd://open-reports-folder'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Klasörü Aç
        </button>
    </div>

    <div class="report-list" id="report-list"></div>

    <div id="empty-state">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="margin-bottom:16px;color:var(--text3)" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>Henüz kaydedilmiş rapor yok.<br>
        Yeni sekmede AI'a <b>"bununla ilgili bir rapor oluştur"</b><br>
        veya <b>"internette bu konu hakkında ne bulabiliyorsun raporla"</b> diye sor.</p>
    </div>

    <script>
        // Delphi tarafından LoadEnd'de (ve tema değiştiğinde canlı) çağrılır
        function applyTheme(theme) {
            document.body.classList.toggle('trace-light', theme === 'light');
        }

        function addReportCard(id, title, type, date) {
            document.getElementById('empty-state').style.display = 'none';
            const badgeClass = type === 'web-arama' ? 'badge-web' : 'badge-standart';
            const badgeText = type === 'web-arama' ? '🌐 Web Araması' : '📄 Standart';
            const iconColor = type === 'web-arama' ? '#81c995' : '#8AB4F8';
            document.getElementById('report-list').insertAdjacentHTML('beforeend', `
                <div class="report-card" id="rc-${id}">
                    <div class="report-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                        </svg>
                    </div>
                    <div class="report-body">
                        <div class="report-title" title="${title}">${title}</div>
                        <div class="report-meta">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                            <span class="report-id-badge">#${id}</span>
                            <span>${date}</span>
                        </div>
                    </div>
                    <div class="report-actions">
                        <button class="btn-view" onclick="openReport(${id})">Görüntüle</button>
                        <button class="btn-del" onclick="deleteReport(${id})">Sil</button>
                    </div>
                </div>`);
        }

        function openReport(id) {
            window.location.href = 'tracecmd://report-open?id=' + id;
        }

        function deleteReport(id) {
            const card = document.getElementById('rc-' + id);
            if (card) { card.style.opacity = '0'; card.style.transition = 'opacity 0.2s'; setTimeout(() => card.remove(), 200); }
            window.location.href = 'tracecmd://report-delete?id=' + id;
            setTimeout(checkEmpty, 250);
        }

        function checkEmpty() {
            if (document.getElementById('report-list').children.length === 0)
                document.getElementById('empty-state').style.display = 'block';
        }
    </script>
</body>
</html>
